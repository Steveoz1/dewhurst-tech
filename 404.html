<script>
/* Burway Rowing Club Race Timer short links (multi-race brief B2):
   /community/burway-race-timer/r/<raceId>[/<page>]  ->  the real page with ?race=<raceId>.
   GitHub Pages serves this file for any address that doesn't exist; everything else gets the page below. */
(function () {
  var m = location.pathname.match(/^\/community\/burway-race-timer\/r\/([^\/]+)(?:\/([^\/]*))?\/?$/i);
  if (!m) return;
  var id = decodeURIComponent(m[1]).toLowerCase(), p = (m[2] || "").toLowerCase();
  var map = { "": ["home.html", ""], "starter": ["start.html", ""], "starter-a": ["start.html", "&i=A"], "starter-b": ["start.html", "&i=B"],
    "finisher": ["finish.html", ""], "finisher-a": ["finish.html", "&i=A"], "finisher-b": ["finish.html", "&i=B"], "results": ["results.html", ""] };
  var t = map.hasOwnProperty(p) ? map[p] : ["home.html", "&bad=1"];
  location.replace("/community/burway-race-timer/" + t[0] + "?race=" + encodeURIComponent(id) + t[1] + location.hash);
})();
</script>
